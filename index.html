<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Text Viewer</title>

 

    <style>

        body {

            margin: 40px;

            background-color: #f5f5f5;

        }

 

        #text-container {

            white-space: pre-wrap;      /* conserve les retours à la ligne */

            font-family: "Georgia", serif;

            font-size: 18px;

            line-height: 1.6;

            color: #222;

            max-width: 900px;

        }

    </style>

</head>

<body>

 

    <div id="text-container">Chargement du texte…</div>

 

    <script>

        fetch('message.txt')

            .then(response => {

                if (!response.ok) {

                    throw new Error("Erreur de chargement du fichier texte");

                }

                return response.text();

            })

            .then(text => {

                document.getElementById('text-container').textContent = text;

            })

            .catch(error => {

                document.getElementById('text-container').textContent =

                    "Impossible de charger le fichier texte.";

                console.error(error);

            });

    </script>

 

</body>

</html>

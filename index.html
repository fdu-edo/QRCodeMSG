<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Message</title>
<style>
    body {
        font-family: Arial, sans-serif;
        font-size: 60px;
        padding: 20px;
        line-height: 1.4;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<div id="msg">Chargement...</div>

<script>
fetch("https://raw.githubusercontent.com/fdu-edo/QRCodeMSG/main/message.txt")
    .then(response => response.text())
    .then(text => {
        document.getElementById("msg").textContent = text;
    })
    .catch(err => {
        document.getElementById("msg").textContent = "Erreur de chargement du message.";
    });
</script>

</body>
</html>
